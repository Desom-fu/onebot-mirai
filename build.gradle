plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.8.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.8.20'
    id 'com.github.johnrengelman.shadow' version '8.1.1'

    id 'net.mamoe.mirai-console' version '2.16.0'
    id 'maven-publish'
}


group = project.maven_group
version = project.version

java {
    archivesBaseName = 'OneBot-Mirai'
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    // 仓库内本地 Maven 仓库：避免依赖已失联的 maven.nova-committee.cn
    maven { url = uri("libs-repo") }
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    implementation("org.java-websocket:Java-WebSocket:1.5.5")
    "shadowLink"("org.java-websocket:Java-WebSocket")
    // 0.2.8 由仓库内 libs-repo 提供（原 maven.nova-committee.cn 已失联）
    implementation("cn.evole.bot:OneBot-SDK:0.2.8")
    "shadowLink"("cn.evole.bot:OneBot-SDK")
    implementation ("io.github.kongweiguang:KHTTP:0.0.3")
    "shadowLink"("io.github.kongweiguang:KHTTP")

    implementation("com.google.code.gson:gson:2.10.1")
    "shadowLink"("com.google.code.gson:gson")
    compileOnly "org.projectlombok:lombok:1.18.34"

    annotationProcessor "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.java-websocket:Java-WebSocket:1.5.5"

    testImplementation('ch.qos.logback:logback-classic:1.4.12')
    testImplementation("org.slf4j:slf4j-simple:2.0.7")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
    testImplementation("org.mockito:mockito-core:5.4.0")
}

artifacts {
    archives jar
    archives shadowJar
}



mirai {
    jvmTarget = JavaVersion.VERSION_17
    excludeDependency("org.slf4j", "slf4j-api")
}

// 打包后强制校验关键类，防止增量构建/依赖解析产出缺类的 jar
tasks.matching { it.name == 'buildPlugin' }.configureEach {
    doLast {
        def jarFile = file("build/mirai/OneBot-Mirai-${project.version}.mirai2.jar")
        if (!jarFile.isFile()) {
            throw new GradleException("插件 jar 不存在: ${jarFile}")
        }
        def required = [
                'cn/evole/onebot/sdk/response/group/GroupInfoResp.class',
                'cn/evole/onebot/sdk/response/group/GroupMemberInfoResp.class',
                'com/google/gson/Gson.class'
        ]
        def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().collect { it.name } as Set
        }
        def missing = required.findAll { !entries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("插件 jar 缺少关键类: ${missing.join(', ')}")
        }
        logger.lifecycle("verify buildPlugin: ${jarFile.name} OK")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release.set(17)
}

test {
    useJUnitPlatform()
}

def resourceTargets = ['plugin.yml']
def replaceProperties = [
        name: name, version: version, author: authors, description: description
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties replaceProperties

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)

            version = "${project.version}"
            artifactId = "${project.archives_base_name}"
            groupId = "${project.maven_group}"
            pom {
                name = 'OneBot Mirai'
                description = '基于 [OneBot] 标准的 mirai 插件版'
                url = 'https://github.com/cnlimiter/onebot-mirai'
                licenses {
                    license {
                        name = 'AGPLV3'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.html'
                    }
                }
                developers {
                    developer {
                        id = 'cnlimiter'
                        name = 'cnlimiter'
                        email = 'cnlimiter@163.com'
                    }
                }
            }
        }
    }

    repositories {
        if (System.getenv('MAVEN_USERNAME') != null && System.getenv('MAVEN_PASSWORD') != null) {
            maven {
                name 'release'
                url = 'https://maven.nova-committee.cn/releases'

                credentials {
                    username System.getenv('MAVEN_USERNAME')
                    password System.getenv('MAVEN_PASSWORD')
                }
            }
        }
    }
}
