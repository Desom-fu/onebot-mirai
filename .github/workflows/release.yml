name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.2.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches project version
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | head -n 1 | cut -d= -f2 | tr -d '[:space:]')
          echo "project version: $VERSION"
          echo "release tag: $RELEASE_TAG"
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::tag $RELEASE_TAG 与 gradle.properties 的 v$VERSION 不一致"
            exit 1
          fi

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test buildPlugin --no-daemon --stacktrace

      - name: Verify shaded plugin jar
        run: |
          JAR=$(ls build/mirai/OneBot-Mirai-*.mirai2.jar | head -n 1)
          echo "JAR=$JAR"
          unzip -l "$JAR" | grep -q "cn/evole/onebot/sdk/" || { echo "::error::OneBot-SDK 未打进 jar"; exit 1; }
          unzip -l "$JAR" | grep -q "com/google/gson/Gson.class" || { echo "::error::Gson 未打进 jar"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: build/mirai/OneBot-Mirai-*.mirai2.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true