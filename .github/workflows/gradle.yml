name: Build

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test buildPlugin --no-daemon --stacktrace

      - name: Verify shaded plugin jar
        run: |
          JAR=$(ls build/mirai/OneBot-Mirai-*.mirai2.jar | head -n 1)
          echo "JAR=$JAR"
          for cls in \
            cn/evole/onebot/sdk/response/group/GroupInfoResp.class \
            cn/evole/onebot/sdk/response/group/GroupMemberInfoResp.class \
            com/google/gson/Gson.class; do
            if ! unzip -l "$JAR" | grep -q "$cls"; then
              echo "::error::插件 jar 缺少 $cls"
              exit 1
            fi
          done

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: OneBot-Mirai-${{ github.sha }}
          path: build/mirai/OneBot-Mirai-*.mirai2.jar
          if-no-files-found: error
