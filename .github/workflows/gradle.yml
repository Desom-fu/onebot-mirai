name: Build

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test buildPlugin --no-daemon --stacktrace

      - name: Verify shaded plugin jar
        run: |
          JAR=$(ls build/mirai/OneBot-Mirai-*.mirai2.jar | head -n 1)
          echo "JAR=$JAR"
          unzip -l "$JAR" | grep -q "cn/evole/onebot/sdk/" || { echo "::error::OneBot-SDK 未打进 jar"; exit 1; }
          unzip -l "$JAR" | grep -q "com/google/gson/Gson.class" || { echo "::error::Gson 未打进 jar"; exit 1; }

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: OneBot-Mirai-${{ github.sha }}
          path: build/mirai/OneBot-Mirai-*.mirai2.jar
          if-no-files-found: error
